[package]
name = "app"
version = "0.1.0"
description = "Aplicación Cuentas Claras"
authors = [
    "Victor Farias",
    "Carlos Bisgono",
    "Rosa Ramirez",
    "Alejandra Mármol",
    "Ricardo Garcia",
    "Rossana Ilardo"


]
license = "Apache-2.0"
repository = "https://github.com/CI3715/Grupo2_LimitTokenReached"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
# Framework ejecutable Tauri (Heredado del workspace)
tauri = { workspace = true }
rusqlite = {version = "0.31", features = ["bundled"] }
serde_json = {workspace = true}
serde = { workspace = true}
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"

# Inclusión de los crates internos del workspace
dominio = { workspace = true }
aplicacion = { workspace = true }
infraestructura = { workspace = true }
contrato = { workspace = true }

# Utilidades de serialización, errores y logs (Heredadas del workspace)

thiserror = { workspace = true }
log = "0.4"
tauri-plugin-log = "2"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native-sync-persistent", "crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(not(any(target_os = "android", target_os = "linux", target_os = "windows", target_os = "macos", target_os = "ios")))'.dependencies]
keyring = "3"
