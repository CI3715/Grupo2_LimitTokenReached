[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cuentas-claras-servidor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "email-validator>=2,<3",
    "sqlalchemy>=2,<3",
    "argon2-cffi>=23.1",
    "PyJWT>=2.8",
]

[project.optional-dependencies]
qa-auth = ["pytest", "httpx", "argon2-cffi", "bcrypt"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src"]
mypy_path = "src"


[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.black]
line-length = 88

[tool.importlinter]
root_package = "cuentas_claras"

[[tool.importlinter.contracts]]
name = "Regla de dependencia hexagonal"
type = "layers"
ignore_imports = [
    "cuentas_claras.infraestructura.base_datos -> cuentas_claras.app.config.config",
    "cuentas_claras.infraestructura.seguridad_auth -> cuentas_claras.app.config.config",
]
layers = [
    "cuentas_claras.app",
    "cuentas_claras.infraestructura",
    "cuentas_claras.aplicacion",
    "cuentas_claras.dominio",
]
