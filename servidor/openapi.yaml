openapi: 3.1.0
info:
  title: Cuentas Claras - Servidor
  version: 0.1.0
paths:
  /usuarios:
    post:
      summary: Registrar Usuario
      operationId: registrar_usuario_usuarios_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrarUsuarioRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioDTO'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorAutenticacionDTO'
          description: Bad Request
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorAutenticacionDTO'
          description: Conflict
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      summary: Buscar Usuario
      operationId: buscar_usuario_usuarios_get
      security:
      - HTTPBearer: []
      parameters:
      - name: usuario
        in: query
        required: true
        schema:
          type: string
          title: Usuario
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
                title: Response Buscar Usuario Usuarios Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /sesiones:
    post:
      summary: Iniciar Sesion
      operationId: iniciar_sesion_sesiones_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IniciarSesionRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SesionDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorAutenticacionDTO'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorAutenticacionDTO'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /usuarios/yo:
    get:
      summary: Perfil Propio
      operationId: perfil_propio_usuarios_yo_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioDTO'
        '401':
          description: Token ausente, inválido o vencido.
      security:
      - HTTPBearer: []
  /amistades:
    get:
      summary: Listar Amistades
      operationId: listar_amistades_amistades_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  items:
                    additionalProperties:
                      type: string
                    type: object
                  type: array
                type: object
                title: Response Listar Amistades Amistades Get
      security:
      - HTTPBearer: []
    post:
      summary: Invitar Amigo
      operationId: invitar_amigo_amistades_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearAmistadRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Invitar Amigo Amistades Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /amistades/{id}/respuesta:
    post:
      summary: Responder Amistad
      operationId: responder_amistad_amistades__id__respuesta_post
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          title: Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RespuestaRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
                title: Response Responder Amistad Amistades  Id  Respuesta Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /amistades/{nombre_usuario}/id:
    get:
      summary: Obtener Id Amistad
      operationId: obtener_id_amistad_amistades__nombre_usuario__id_get
      security:
      - HTTPBearer: []
      parameters:
      - name: nombre_usuario
        in: path
        required: true
        schema:
          type: string
          title: Nombre Usuario
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
                title: Response Obtener Id Amistad Amistades  Nombre Usuario  Id Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /amistades/{id}:
    delete:
      summary: Eliminar Amistad
      operationId: eliminar_amistad_amistades__id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          title: Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /grupos:
    get:
      summary: Listar Grupos
      operationId: listar_grupos_grupos_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  items:
                    additionalProperties:
                      anyOf:
                      - type: string
                      - type: 'null'
                    type: object
                  type: array
                type: object
                title: Response Listar Grupos Grupos Get
      security:
      - HTTPBearer: []
    post:
      summary: Crear Grupo
      operationId: crear_grupo_grupos_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearGrupoRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  anyOf:
                  - type: string
                  - type: 'null'
                type: object
                title: Response Crear Grupo Grupos Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /grupos/{id}/miembros:
    post:
      summary: Invitar Miembro
      operationId: invitar_miembro_grupos__id__miembros_post
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          title: Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitarMiembroRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
                title: Response Invitar Miembro Grupos  Id  Miembros Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /grupos/{id}/miembros/yo/respuesta:
    post:
      summary: Responder Invitacion Grupo
      operationId: responder_invitacion_grupo_grupos__id__miembros_yo_respuesta_post
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          title: Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RespuestaRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
                title: Response Responder Invitacion Grupo Grupos  Id  Miembros Yo
                  Respuesta Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /grupos/{id}/gastos:
    post:
      summary: Registrar Gasto (con soporte idempotente)
      description: Registra un gasto compartido. Si se envía con una Idempotency-Key ya procesada, devuelve el gasto existente (200) en lugar de duplicarlo (201).
      operationId: registrar_gasto_grupos__id__gastos_post
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          title: Id
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
        description: Clave única generada por el cliente para garantizar idempotencia en reintentos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrarGastoRequest'
      responses:
        '200':
          description: La clave de idempotencia ya fue procesada previamente. Se devuelve el gasto registrado.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Registrar Gasto Grupos  Id  Gastos Post
        '201':
          description: Gasto registrado exitosamente.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Registrar Gasto Grupos  Id  Gastos Post
        '400':
          description: Datos inválidos (ej. porcentajes que no suman 100, montos que no cuadran, cursor inválido).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Token ausente, inválido o vencido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorAutenticacionDTO'
        '404':
          description: Grupo inexistente o el usuario no es miembro (misma respuesta en ambos casos).
        '409':
          description: La clave de idempotencia ya fue usada previamente, pero con datos distintos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorAutenticacionDTO'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /grupos/{id}:
    get:
      summary: Ver Grupo
      operationId: ver_grupo_grupos__id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Ver Grupo Grupos  Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /cambios:
    get:
      summary: Obtener cambios (eventos de gastos de grupo) para sincronización
      description: Devuelve los eventos del usuario autenticado posteriores al cursor indicado, en lotes de máximo 100, junto con el nuevo cursor.
      operationId: obtener_cambios_cambios_get
      security:
      - HTTPBearer: []
      parameters:
      - name: desde
        in: query
        required: false
        schema:
          type: integer
          format: int64
          title: Desde
        description: Cursor a partir del cual obtener los eventos. Si se omite, devuelve desde el inicio.
      responses:
        '200':
          description: Lista de eventos y nuevo cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaCambios'
        '400':
          description: Cursor inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorAutenticacionDTO'
        '401':
          description: Token ausente, inválido o vencido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorAutenticacionDTO'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /ping:
    get:
      summary: Ping
      operationId: ping_ping_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingRespuesta'
components:
  schemas:
    CrearAmistadRequest:
      properties:
        usuario:
          type: string
          title: Usuario
      additionalProperties: false
      type: object
      required:
      - usuario
      title: CrearAmistadRequest
    CrearGrupoRequest:
      properties:
        nombre:
          type: string
          maxLength: 120
          minLength: 1
          title: Nombre
        descripcion:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          title: Descripcion
        moneda:
          type: string
          pattern: ^[A-Z]{3}$
          title: Moneda
        actividad:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Actividad
      additionalProperties: false
      type: object
      required:
      - nombre
      - moneda
      title: CrearGrupoRequest
    ErrorAutenticacionDTO:
      properties:
        campo:
          type: string
          title: Campo
        mensaje:
          type: string
          title: Mensaje
      additionalProperties: false
      type: object
      required:
      - campo
      - mensaje
      title: ErrorAutenticacionDTO
    EventoCambio:
      type: object
      required:
      - id_evento
      - tipo
      - grupo_id
      - gasto_id
      - concepto
      - fecha
      - moneda
      - monto_parte
      - incluye_redondeo
      - posicion_cursor
      properties:
        id_evento:
          type: string
          description: Identificador único e inmutable del evento (INV-13).
        tipo:
          type: string
          description: Tipo de evento (ej. GastoDeGrupoAplicado).
        grupo_id:
          type: string
          description: ID del grupo al que pertenece el gasto.
        gasto_id:
          type: string
          description: ID del gasto de grupo.
        concepto:
          type: string
          description: Concepto del gasto (ej. Hotel, Cena).
        fecha:
          type: string
          format: date-time
          description: Fecha del gasto en formato ISO 8601.
        moneda:
          type: string
          description: Código ISO de 3 letras de la moneda del grupo.
        monto_parte:
          type: string
          description: Monto exacto de la parte en formato decimal (String para evitar pérdida de precisión, INV-03).
        incluye_redondeo:
          type: boolean
          description: True si incluye céntimos de residuo (Sección 2.4 Entrega 6).
        posicion_cursor:
          type: integer
          format: int64
          description: Posición creciente en el registro del usuario, usada como cursor.
      additionalProperties: false
      title: EventoCambio
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    IniciarSesionRequest:
      properties:
        correo:
          type: string
          title: Correo
        contrasena:
          type: string
          format: password
          title: Contrasena
          writeOnly: true
      additionalProperties: false
      type: object
      required:
      - correo
      - contrasena
      title: IniciarSesionRequest
    InvitarMiembroRequest:
      properties:
        usuario:
          type: string
          title: Usuario
      additionalProperties: false
      type: object
      required:
      - usuario
      title: InvitarMiembroRequest
    PingRespuesta:
      properties:
        estado:
          type: string
          title: Estado
        mensaje:
          type: string
          title: Mensaje
        version:
          type: string
          title: Version
        timestamp:
          type: string
          title: Timestamp
      type: object
      required:
      - estado
      - mensaje
      - version
      - timestamp
      title: PingRespuesta
    RegistrarGastoRequest:
      properties:
        concepto:
          type: string
          maxLength: 200
          minLength: 1
          title: Concepto
        monto:
          type: string
          title: Monto
        fecha:
          type: string
          format: date
          title: Fecha
        pagador:
          type: string
          title: Pagador
        regla:
          type: string
          enum:
          - iguales
          - porcentajes
          - fijos
          title: Regla
        participantes:
          items:
            type: string
          type: array
          minItems: 1
          title: Participantes
        valores:
          additionalProperties:
            type: string
          type: object
          title: Valores
      additionalProperties: false
      type: object
      required:
      - concepto
      - monto
      - fecha
      - pagador
      - regla
      - participantes
      title: RegistrarGastoRequest
    RegistrarUsuarioRequest:
      properties:
        nombre_usuario:
          type: string
          title: Nombre Usuario
        nombre_visible:
          type: string
          title: Nombre Visible
        correo:
          type: string
          title: Correo
        contrasena:
          type: string
          format: password
          title: Contrasena
          writeOnly: true
      additionalProperties: false
      type: object
      required:
      - nombre_usuario
      - nombre_visible
      - correo
      - contrasena
      title: RegistrarUsuarioRequest
    RespuestaCambios:
      type: object
      required:
      - eventos
      - nuevo_cursor
      - hay_mas
      properties:
        eventos:
          type: array
          items:
            $ref: '#/components/schemas/EventoCambio'
          maxItems: 100
          description: Lote de eventos (máximo 100 por petición).
        nuevo_cursor:
          type: integer
          format: int64
          description: Cursor para la próxima petición.
        hay_mas:
          type: boolean
          description: True si quedan más eventos por sincronizar.
      additionalProperties: false
      title: RespuestaCambios
    RespuestaRequest:
      properties:
        aceptar:
          type: boolean
          title: Aceptar
      additionalProperties: false
      type: object
      required:
      - aceptar
      title: RespuestaRequest
    SesionDTO:
      properties:
        token:
          type: string
          minLength: 1
          title: Token
        vence_en:
          type: string
          format: date-time
          title: Vence En
      additionalProperties: false
      type: object
      required:
      - token
      - vence_en
      title: SesionDTO
    UsuarioDTO:
      properties:
        nombre_usuario:
          type: string
          title: Nombre Usuario
        nombre_visible:
          type: string
          title: Nombre Visible
        correo:
          type: string
          title: Correo
        fecha_alta:
          type: string
          format: date-time
          title: Fecha Alta
      additionalProperties: false
      type: object
      required:
      - nombre_usuario
      - nombre_visible
      - correo
      - fecha_alta
      title: UsuarioDTO
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer