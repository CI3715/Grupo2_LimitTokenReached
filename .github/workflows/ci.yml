# CI - Cuentas Claras (Entregas 3 y 4)

name: CI - Cuentas Claras

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'servidor/**'
      - 'app/**'
      - '.github/workflows/**'
      - 'README.md'
      - 'docs/**'
  push:
    branches: [ main ]

jobs:

  # BACKEND (FastAPI - Python)
  backend-lint:
    name: Backend (FastAPI) - Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./servidor
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pydantic-settings httpx
          pip install ruff mypy black import-linter pytest pip-licenses
      - name: Check License Compatibility
        run: pip-licenses --fail-on="GPL;GPL-2.0;GPL-3.0;AGPL;AGPL-3.0;LGPL;LGPL-2.1;LGPL-3.0"
      - name: Run Ruff
        run: ruff check .
      - name: Run MyPy
        run: mypy src
      - name: Run Import Linter
        run: PYTHONPATH=src lint-imports

  # FRONTEND (Next.js - TypeScript)
  frontend-lint:
    name: Frontend (Next.js) - Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Run ESLint
        run: npm run lint
      - name: Run movement frontend tests
        run: npm run test:movements
      - name: Build Next.js
        run: npm run build

  # RUST: contratos E4 y regresión E3; no certifica el flujo E4 completo.
  rust-lint:
    name: Rust - Contratos, núcleo y SQLite local
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            app/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # Solo verificar que el crate contrato (DTOs) compile
      - name: Check contrato compilation
        run: cargo check -p contrato

      # Incluye tasa_tests y patrimonio_tests: prueban DTOs, no casos de uso E4.
      - name: Run contract and core unit tests
        run: cargo test -p contrato -p aplicacion -p dominio

      # Selección explícita: conexion_servidor necesita FastAPI y queda fuera.
      # SQLite en memoria prueba adaptadores, no sustituye el fake exigido en E4.
      - name: Run local SQLite regression tests
        run: cargo test -p infraestructura --test repositorio_movimientos_sqlite --test repositorio_categorias_sqlite --test repositorio_monedas_sqlite
